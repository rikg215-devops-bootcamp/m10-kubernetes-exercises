apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.appNamespace }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.appHost }}
    http:
      paths:
      - backend:
          service:
            name: {{ .Values.appName }}
            port:
              number: {{ .Values.svcPort }}
        path: /
        pathType: Prefix
