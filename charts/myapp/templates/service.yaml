apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.appName }}
  name: {{ .Values.appName }}
  namespace: {{ .Values.appNamespace }}
spec:
  ports:
  - port: {{ .Values.svcPort }}
    targetPort: {{ .Values.appPort }}
  selector:
    app: {{ .Values.appName }}
  type: {{ .Values.svcType }} 

